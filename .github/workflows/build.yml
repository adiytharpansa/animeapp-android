name: Build & Uji AnimeApp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: animeapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  uji-emulator:
    name: Uji Emulator (harus bisa memutar)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Unduh APK
        uses: actions/download-artifact@v4
        with:
          name: animeapp-debug-apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang & putar di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r app-debug.apk
            adb shell am start -n com.adiyth.animeapp/.MainActivity
            sleep 16
            adb exec-out screencap -p > uji-beranda.png
            adb shell am force-stop com.adiyth.animeapp
            sleep 2
            adb shell 'am start -n com.adiyth.animeapp/.MainActivity --es autoplay_title "Chainsaw Man" --ei autoplay_episode 5'
            sleep 55
            adb exec-out screencap -p > uji-putar-1.png
            sleep 25
            adb exec-out screencap -p > uji-putar-2.png
            adb shell dumpsys activity activities | grep -i mResumedActivity || true
            adb logcat -d -t 400 > logcat.txt || true

      - name: Unggah bukti uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-uji-emulator
          path: |
            uji-beranda.png
            uji-putar-1.png
            uji-putar-2.png
            logcat.txt
          if-no-files-found: warn
